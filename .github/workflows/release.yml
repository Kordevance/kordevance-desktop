name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

env:
  VPK_VERSION: 1.2.0
  REPO_URL: https://github.com/Kordevance/kordevance-desktop

jobs:
  prepare:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate tag is x.x.x
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' is not in x.x.x form — aborting." >&2
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows (x64)
    needs: prepare
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install vpk
        run: dotnet tool install -g vpk --version "$env:VPK_VERSION"

      - name: Publish
        run: dotnet publish Kori/Kori.csproj -c Release -r win-x64 --self-contained -o publish/win-x64

      - name: Pack (unsigned)
        run: |
          vpk pack `
            --packId com.kordevance.kori `
            --packTitle Kori `
            --packVersion ${{ needs.prepare.outputs.version }} `
            --channel win `
            --outputDir Releases/win `
            --packDir publish/win-x64 `
            --mainExe Kori.exe

      - uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: Releases/win

  build-macos:
    name: Build macOS (${{ matrix.rid }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: production
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_INSTALLER_CERT_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
      MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
      CI_KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
      NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      MACOS_APP_SIGN_IDENTITY: ${{ secrets.MACOS_APP_SIGN_IDENTITY }}
      MACOS_INSTALLER_SIGN_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            channel: osx-arm64
            runner: macos-15
          - rid: osx-x64
            channel: osx-x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Require signing secrets
        run: |
          missing=()
          for name in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD MACOS_INSTALLER_CERT_P12_BASE64 MACOS_INSTALLER_CERT_PASSWORD CI_KEYCHAIN_PASSWORD NOTARY_API_KEY_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID MACOS_APP_SIGN_IDENTITY; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required macOS signing secrets: ${missing[*]}" >&2
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install vpk
        run: dotnet tool install -g vpk --version "$VPK_VERSION"

      - name: Publish
        run: dotnet publish Kori/Kori.csproj -c Release -r ${{ matrix.rid }} --self-contained -o "publish/${{ matrix.rid }}"

      - name: Import signing certificates
        run: |
          security create-keychain -p "$CI_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p "$CI_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain-db"

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > app_cert.p12
          security import app_cert.p12 -k "$RUNNER_TEMP/build.keychain-db" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm app_cert.p12

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CI_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"

      - name: Register notarization credentials
        run: |
          echo "$NOTARY_API_KEY_BASE64" | base64 --decode > notary_key.p8
          xcrun notarytool store-credentials ci-profile \
            --key notary_key.p8 \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$RUNNER_TEMP/build.keychain-db"
          rm notary_key.p8

      - name: Pack (signed + notarized, app only, pkg is built separately)
        run: |
          vpk pack \
            --packId com.kordevance.kori \
            --packTitle Kori \
            --packVersion ${{ needs.prepare.outputs.version }} \
            --channel ${{ matrix.channel }} \
            --outputDir "Releases/${{ matrix.rid }}" \
            --packDir "publish/${{ matrix.rid }}" \
            --mainExe Kori \
            --icon packaging/macos/Kori.icns \
            --plist packaging/macos/Info.plist \
            --signEntitlements packaging/macos/Kori.entitlements \
            --signAppIdentity "$MACOS_APP_SIGN_IDENTITY" \
            --notaryProfile ci-profile \
            --keychain "$RUNNER_TEMP/build.keychain-db" \
            --noInst \
            --verbose

      - name: Install rcodesign
        run: |
          curl -fsSL -o rcodesign.tar.gz \
            https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/0.29.0/apple-codesign-0.29.0-macos-universal.tar.gz
          mkdir -p "$RUNNER_TEMP/rcodesign"
          tar -xzf rcodesign.tar.gz -C "$RUNNER_TEMP/rcodesign" --strip-components=1
          rm rcodesign.tar.gz
          echo "$RUNNER_TEMP/rcodesign" >> "$GITHUB_PATH"

      - name: Build & sign .pkg installer with rcodesign
        run: |
          set -euo pipefail

          WORKDIR="$RUNNER_TEMP/pkgbuild"
          mkdir -p "$WORKDIR"

          ZIP_PATH="$(find "Releases/${{ matrix.rid }}" -iname '*.zip' | head -n1)"
          if [ -z "$ZIP_PATH" ]; then
            echo "Could not find vpk's portable .zip in Releases/${{ matrix.rid }}" >&2
            exit 1
          fi

          mkdir -p "$WORKDIR/app"
          ditto -x -k "$ZIP_PATH" "$WORKDIR/app"
          APP_PATH="$(find "$WORKDIR/app" -maxdepth 1 -iname '*.app' | head -n1)"
          if [ -z "$APP_PATH" ]; then
            echo "Could not find .app inside $ZIP_PATH" >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          pkgbuild \
            --component "$APP_PATH" \
            --install-location /Applications \
            --identifier com.kordevance.kori \
            --version "${{ needs.prepare.outputs.version }}" \
            "$WORKDIR/unsigned.pkg"

          echo "$MACOS_INSTALLER_CERT_P12_BASE64" | base64 --decode > "$WORKDIR/installer_cert.p12"
          cp "$WORKDIR/unsigned.pkg" "$WORKDIR/signed.pkg"
          rcodesign sign \
            --p12-file "$WORKDIR/installer_cert.p12" \
            --p12-password "$MACOS_INSTALLER_CERT_PASSWORD" \
            "$WORKDIR/signed.pkg"
          rm "$WORKDIR/installer_cert.p12"

          echo "$NOTARY_API_KEY_BASE64" | base64 --decode > "$WORKDIR/notary_key.p8"
          rcodesign encode-app-store-connect-api-key \
            -o "$WORKDIR/notary_key.json" \
            "$NOTARY_ISSUER_ID" "$NOTARY_KEY_ID" "$WORKDIR/notary_key.p8"
          rm "$WORKDIR/notary_key.p8"

          rcodesign notary-submit \
            --api-key-file "$WORKDIR/notary_key.json" \
            --staple \
            "$WORKDIR/signed.pkg"
          rm "$WORKDIR/notary_key.json"

          cp "$WORKDIR/signed.pkg" "Releases/${{ matrix.rid }}/com.kordevance.kori-${{ matrix.channel }}-Setup.pkg"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: Releases/${{ matrix.rid }}

  publish:
    name: Publish release
    needs: [prepare, build-windows, build-macos]
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install vpk
        run: dotnet tool install -g vpk --version "$VPK_VERSION"

      - uses: actions/download-artifact@v4
        with:
          name: release-win
          path: Releases/win

      - uses: actions/download-artifact@v4
        with:
          name: release-osx-arm64
          path: Releases/osx-arm64

      - uses: actions/download-artifact@v4
        with:
          name: release-osx-x64
          path: Releases/osx-x64

      - name: Upload Windows channel
        run: |
          vpk upload github \
            --repoUrl "$REPO_URL" \
            --token "$GH_TOKEN" \
            --channel win \
            --outputDir Releases/win \
            --tag ${{ needs.prepare.outputs.version }} \
            --publish

      - name: Upload macOS arm64 channel
        run: |
          vpk upload github \
            --repoUrl "$REPO_URL" \
            --token "$GH_TOKEN" \
            --channel osx-arm64 \
            --outputDir Releases/osx-arm64 \
            --tag ${{ needs.prepare.outputs.version }} \
            --merge true \
            --publish

      - name: Upload macOS x64 channel
        run: |
          vpk upload github \
            --repoUrl "$REPO_URL" \
            --token "$GH_TOKEN" \
            --channel osx-x64 \
            --outputDir Releases/osx-x64 \
            --tag ${{ needs.prepare.outputs.version }} \
            --merge true \
            --publish

      - name: Attach .pkg installers to release
        run: |
          # vpk upload only tracks the files it manages in its own manifest,
          # so the rcodesign-built .pkg installers need to be attached
          # separately or they'd just get left behind.
          gh release upload ${{ needs.prepare.outputs.version }} \
            Releases/osx-arm64/*.pkg \
            Releases/osx-x64/*.pkg \
            --repo "${REPO_URL#https://github.com/}" \
            --clobber
